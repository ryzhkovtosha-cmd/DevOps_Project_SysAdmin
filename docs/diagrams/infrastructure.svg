28" text-anchor="start">Схема инфраструктуры VPN-сервиса</text><text x="30" y="66" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">Yandex Cloud · VPC infra-net · две геозоны · все адреса по состоянию на момент сдачи</text><rect x="30" y="90" width="250" height="510" rx="10" fill="#fbfbfc" stroke="#c9ced6" stroke-width="1.5"/><text x="46" y="114" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#8a8f98" text-anchor="start">ВНЕШНИЙ МИР</text><rect x="46" y="130" width="218" height="76" rx="10" fill="#eef4fb" stroke="#4f86c6" stroke-width="1.5"/><text x="60" y="154" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">Сотрудники</text><text x="60" y="172" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">OpenVPN-клиент</text><text x="60" y="190" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">Linux · macOS · Windows</text><rect x="46" y="232" width="218" height="76" rx="10" fill="#fdf2ec" stroke="#c7703f" stroke-width="1.5"/><text x="60" y="256" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">Администратор</text><text x="60" y="274" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">SSH только с ADMIN_CIDR</text><text x="60" y="292" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">yc CLI · скрипты · пакеты</text><rect x="46" y="510" width="218" height="64" rx="10" fill="#f6f7f8" stroke="#c9ced6" stroke-width="1.5"/><text x="60" y="534" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start">Почтовый сервер</text><text x="60" y="552" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">smtp.yandex.ru:587, TLS</text><rect x="300" y="90" width="870" height="510" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="6 4"/><text x="316" y="114" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#8a8f98" text-anchor="start">VPC infra-net</text><rect x="316" y="124" width="574" height="462" rx="10" fill="#ffffff" stroke="#c9ced6" stroke-width="1.5" stroke-dasharray="6 4"/><text x="332" y="146" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#8a8f98" text-anchor="start">infra-subnet-a · ru-central1-a · 10.128.0.0/24</text><rect x="332" y="158" width="530" height="122" rx="10" fill="#eef7f1" stroke="#3f8f5f" stroke-width="1.5"/><text x="348" y="182" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#1f2328" text-anchor="start">vpn-server</text><text x="348" y="201" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">10.128.0.11 · публичный 111.88.249.0 (статический)</text><text x="348" y="220" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">OpenVPN 1194/udp · туннель 10.8.0.0/24 · NAT</text><text x="348" y="239" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">tls-crypt · AES-256-GCM · проверка списка отзыва</text><text x="348" y="258" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#3f8f5f" text-anchor="start">node-exporter :9100 + метрики OpenVPN</text><rect x="332" y="292" width="530" height="122" rx="10" fill="#fdf1f1" stroke="#c0504d" stroke-width="1.5"/><text x="348" y="316" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#1f2328" text-anchor="start">ca-server</text><text x="348" y="335" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">10.128.0.10 · публичный 46.21.247.189 (статический)</text><text x="348" y="354" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">Easy-RSA · PKI в /var/lib/infra-ca, права 0700</text><text x="348" y="373" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">сетевых служб нет, кроме SSH</text><text x="348" y="392" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#c0504d" text-anchor="start">node-exporter :9100 + сроки сертификатов</text><rect x="332" y="426" width="530" height="146" rx="10" fill="#f4f0fb" stroke="#7a62bd" stroke-width="1.5"/><text x="348" y="450" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#1f2328" text-anchor="start">mon-server</text><text x="348" y="469" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">10.128.0.12 · публичный 46.21.244.236 (эфемерный)</text><text x="348" y="488" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">nginx 10.128.0.12:9090 и :9093 — вход по паролю</text><text x="348" y="507" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">Prometheus 127.0.0.1:9090 · Alertmanager 127.0.0.1:9093</text><text x="348" y="526" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">22 правила алертов · оповещения на почту</text><text x="348" y="545" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#7a62bd" text-anchor="start">node-exporter :9100</text><rect x="904" y="124" width="250" height="300" rx="10" fill="#ffffff" stroke="#c9ced6" stroke-width="1.5" stroke-dasharray="6 4"/><text x="920" y="146" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#8a8f98" text-anchor="start">infra-subnet-b</text><text x="920" y="163" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#8a8f98" text-anchor="start">ru-central1-b · 10.129.0.0/24</text><rect x="920" y="178" width="218" height="160" rx="10" fill="#fdf9ec" stroke="#b8901c" stroke-width="1.5"/><text x="934" y="202" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#1f2328" text-anchor="start">backup-server</text><text x="934" y="221" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">10.129.0.10</text><text x="934" y="240" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">публичного адреса нет</text><text x="934" y="259" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">копии в /srv/backups</text><text x="934" y="278" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">пользователь infra-backup</text><text x="934" y="297" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#b8901c" text-anchor="start">node-exporter :9100</text><rect x="904" y="440" width="250" height="146" rx="10" fill="#f6f7f8" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="6 4"/><text x="920" y="462" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#8a8f98" text-anchor="start">СЕРВИСЫ ОБЛАКА, ВНЕ VPC</text><text x="920" y="488" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start">Снимки дисков</text><text x="920" y="506" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">расписание infra-daily</text><text x="920" y="524" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">диски ca-server и vpn-server</text><text x="920" y="552" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#8a8f98" text-anchor="start">Object Storage</text><text x="920" y="570" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#8a8f98" text-anchor="start">подготовлено, не включено</text><path d="M 264 168 L 330 200" fill="none" stroke="#3f8f5f" stroke-width="2.6" marker-end="url(#a3f8f5f)"/><text x="270" y="166" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#3f8f5f" text-anchor="start">1194/udp</text><path d="M 264 272 L 298 272 L 298 350 L 330 350" fill="none" stroke="#c7703f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ac7703f)"/><text x="250" y="330" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#c7703f" text-anchor="end">SSH 22</text><path d="M 332 548 L 266 548" fill="none" stroke="#7a62bd" stroke-width="2" marker-end="url(#a7a62bd)"/><text x="299" y="540" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#7a62bd" text-anchor="middle">587</text><path d="M 876 500 L 876 212" fill="none" stroke="#7a62bd" stroke-width="2" stroke-dasharray="3 3"/><path d="M 876 500 L 864 500" fill="none" stroke="#7a62bd" stroke-width="2" marker-end="url(#a7a62bd)"/><path d="M 876 219 L 864 219" fill="none" stroke="#7a62bd" stroke-width="2" marker-end="url(#a7a62bd)"/><path d="M 876 352 L 864 352" fill="none" stroke="#7a62bd" stroke-width="2" marker-end="url(#a7a62bd)"/><path d="M 876 316 L 918 316" fill="none" stroke="#7a62bd" stroke-width="2" marker-end="url(#a7a62bd)"/><path d="M 862 250 L 918 250" fill="none" stroke="#b8901c" stroke-width="2.4" marker-end="url(#ab8901c)"/><path d="M 862 400 L 890 400 L 890 284 L 918 284" fill="none" stroke="#b8901c" stroke-width="2.4" marker-end="url(#ab8901c)"/><rect x="30" y="620" width="1140" height="190" rx="10" fill="#fbfbfc" stroke="#c9ced6" stroke-width="1.5"/><text x="46" y="646" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">Принципы разграничения доступа</text><circle cx="54" cy="670" r="5" fill="#3f8f5f"/><text x="68" y="674" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">1194/udp — единственный порт, открытый всему интернету. Пакет без общего ключа tls-crypt отбрасывается до начала переговоров.</text><circle cx="54" cy="694" r="5" fill="#c7703f"/><text x="68" y="698" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">SSH 22 — только с адреса администратора. backup-server публичного адреса не имеет и доступен только изнутри сети, через VPN.</text><circle cx="54" cy="718" r="5" fill="#7a62bd"/><text x="68" y="722" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Метрики: порт 9100 открыт только для 10.128.0.12. Метрики OpenVPN, сертификатов и бэкапов идут через тот же порт.</text><circle cx="54" cy="742" r="5" fill="#b8901c"/><text x="68" y="746" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Копии шифруются GPG AES-256 до отправки, целостность сверяется SHA-256 на приёмной стороне. Копии — в другой геозоне.</text><circle cx="54" cy="766" r="5" fill="#c0504d"/><text x="68" y="770" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Удостоверяющий центр не обслуживает сетевых запросов. Приватные ключи сотрудников на него не попадают — подписывается только CSR.</text><text x="68" y="798" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#8a8f98" text-anchor="start">Два рубежа обороны заданы независимо: группы безопасности облака и firewalld в каждой ОС.</text></svg>