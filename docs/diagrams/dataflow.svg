<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1010" width="1200" height="1010"><defs><marker id="a5b6470" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6470"/></marker><marker id="a1f2328" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2328"/></marker><marker id="a7a62bd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7a62bd"/></marker><marker id="ac0504d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0504d"/></marker><marker id="a4f86c6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f86c6"/></marker><marker id="ac9ced6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c9ced6"/></marker><marker id="ab8901c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8901c"/></marker><marker id="a3f8f5f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3f8f5f"/></marker><marker id="ac7703f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c7703f"/></marker><marker id="a8a8f98" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8f98"/></marker></defs><rect width="1200" height="1010" fill="#ffffff"/><text x="30" y="42" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1f2328" text-anchor="start">Схема потоков данных</text><text x="30" y="66" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">Кто с кем общается, по каким портам и что передаётся</text><rect x="30" y="86" width="1140" height="230" rx="10" fill="#fbfbfc" stroke="#c9ced6" stroke-width="1.5"/><text x="46" y="112" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#1f2328" text-anchor="start">Поток 1. Выдача доступа сотруднику</text><rect x="50" y="128" width="240" height="78" rx="10" fill="#eef4fb" stroke="#4f86c6" stroke-width="1.5"/><text x="64" y="152" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start">Сотрудник</text><text x="64" y="171" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">gen-client-request.sh</text><text x="64" y="190" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">создаёт ключ и CSR</text><rect x="330" y="128" width="240" height="78" rx="10" fill="#fdf2ec" stroke="#c7703f" stroke-width="1.5"/><text x="344" y="152" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start">Администратор</text><text x="344" y="171" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">issue-client-cert.sh</text><text x="344" y="190" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">сверяет отпечаток</text><rect x="610" y="128" width="240" height="78" rx="10" fill="#fdf1f1" stroke="#c0504d" stroke-width="1.5"/><text x="624" y="152" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start">ca-server</text><text x="624" y="171" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">infra-ca-sign client</text><text x="624" y="190" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">подписывает CSR</text><rect x="890" y="128" width="240" height="78" rx="10" fill="#eef7f1" stroke="#3f8f5f" stroke-width="1.5"/><text x="904" y="152" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start">vpn-server</text><text x="904" y="171" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">infra-vpn-make-client</text><text x="904" y="190" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">собирает комплект</text><path d="M 290 167 L 328 167" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#a5b6470)"/><text x="309" y="158" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6470" text-anchor="middle">.req</text><path d="M 570 167 L 608 167" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#a5b6470)"/><text x="589" y="158" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6470" text-anchor="middle">scp 22</text><path d="M 850 167 L 888 167" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#a5b6470)"/><text x="869" y="158" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6470" text-anchor="middle">.crt</text><path d="M 1010 206 L 1010 234 L 170 234 L 170 210" fill="none" stroke="#5b6470" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a5b6470)"/><text x="590" y="252" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5b6470" text-anchor="middle">комплект .tar.gz: ca.crt + сертификат + ta.key + шаблон; assemble-config.sh собирает .ovpn у сотрудника</text><rect x="50" y="266" width="1100" height="36" rx="6" fill="#fdf9ec" stroke="#b8901c" stroke-width="1.5"/><text x="66" y="289" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">Приватный ключ сотрудника не пересекает ни одну стрелку: он создаётся на его машине и остаётся там.</text><rect x="30" y="330" width="1140" height="170" rx="10" fill="#fbfbfc" stroke="#c9ced6" stroke-width="1.5"/><text x="46" y="356" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#1f2328" text-anchor="start">Поток 2. Рабочий трафик сотрудника</text><rect x="50" y="372" width="250" height="60" rx="10" fill="#eef4fb" stroke="#4f86c6" stroke-width="1.5"/><text x="64" y="396" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start">Ноутбук</text><text x="64" y="416" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">tun0 · 10.8.0.x</text><rect x="430" y="372" width="280" height="60" rx="10" fill="#eef7f1" stroke="#3f8f5f" stroke-width="1.5"/><text x="444" y="396" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start">vpn-server</text><text x="444" y="416" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">10.8.0.1 → NAT → 111.88.249.0</text><rect x="870" y="372" width="250" height="60" rx="10" fill="#f6f7f8" stroke="#9aa5b1" stroke-width="1.5"/><text x="884" y="396" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start">Интернет</text><text x="884" y="416" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">видит адрес 111.88.249.0</text><path d="M 300 402 L 428 402" fill="none" stroke="#3f8f5f" stroke-width="2.6" marker-end="url(#a3f8f5f)"/><text x="364" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#3f8f5f" text-anchor="middle">1194/udp</text><path d="M 710 402 L 868 402" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#a5b6470)"/><text x="789" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6470" text-anchor="middle">открытый трафик</text><text x="50" y="456" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">push redirect-gateway заворачивает в туннель весь трафик; push dhcp-option DNS переводит разрешение имён внутрь туннеля.</text><text x="50" y="478" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6470" text-anchor="start">Провайдер сотрудника видит только шифрованный поток к одному адресу — ни содержимого, ни имён сайтов.</text><rect x="30" y="514" width="560" height="230" rx="10" fill="#fbfbfc" stroke="#c9ced6" stroke-width="1.5"/><text x="46" y="540" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#1f2328" text-anchor="start">Поток 3. Сбор метрик</text><rect x="50" y="556" width="190" height="58" rx="10" fill="#f4f0fb" stroke="#7a62bd" stroke-width="1.5"/><text x="64" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start">Prometheus</text><text x="64" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">127.0.0.1:9090</text><rect x="330" y="552" width="240" height="66" rx="10" fill="#ffffff" stroke="#c9ced6" stroke-width="1.5"/><text x="344" y="574" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">ca, vpn, mon, backup</text><text x="344" y="596" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2328" text-anchor="start">node-exporter :9100</text><path d="M 240 585 L 328 585" fill="none" stroke="#7a62bd" stroke-width="2" marker-end="url(#a7a62bd)"/><text x="284" y="577" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#7a62bd" text-anchor="middle">раз в 15 с</text><text x="50" y="646" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Свои метрики — через textfile-коллектор, без лишних портов:</text><text x="50" y="667" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">сроки сертификатов и CRL — раз в час</text><text x="50" y="688" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">состояние OpenVPN — раз в 30 секунд</text><text x="50" y="709" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">результат копирования — при каждом запуске</text><rect x="610" y="514" width="560" height="230" rx="10" fill="#fbfbfc" stroke="#c9ced6" stroke-width="1.5"/><text x="626" y="540" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#1f2328" text-anchor="start">Поток 4. Оповещения</text><rect x="630" y="556" width="150" height="58" rx="10" fill="#f4f0fb" stroke="#7a62bd" stroke-width="1.5"/><text x="644" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start">Prometheus</text><text x="644" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">22 правила</text><rect x="810" y="556" width="160" height="58" rx="10" fill="#f4f0fb" stroke="#7a62bd" stroke-width="1.5"/><text x="824" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start">Alertmanager</text><text x="824" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">127.0.0.1:9093</text><rect x="1000" y="556" width="150" height="58" rx="10" fill="#fdf2ec" stroke="#c7703f" stroke-width="1.5"/><text x="1014" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start">Почта</text><text x="1014" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">SMTP 587, TLS</text><path d="M 780 585 L 808 585" fill="none" stroke="#7a62bd" stroke-width="2" marker-end="url(#a7a62bd)"/><path d="M 970 585 L 998 585" fill="none" stroke="#c7703f" stroke-width="2" marker-end="url(#ac7703f)"/><text x="630" y="646" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Группировка по алерту и машине: падение четырёх</text><text x="630" y="667" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">серверов даёт одно письмо, а не четыре.</text><text x="630" y="688" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Подавление: при InstanceDown гасятся вторичные</text><text x="630" y="709" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">алерты той же машины.</text><rect x="30" y="758" width="560" height="170" rx="10" fill="#fbfbfc" stroke="#c9ced6" stroke-width="1.5"/><text x="46" y="784" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#1f2328" text-anchor="start">Поток 5. Веб-доступ к мониторингу</text><rect x="50" y="800" width="200" height="60" rx="10" fill="#fdf2ec" stroke="#c7703f" stroke-width="1.5"/><text x="64" y="824" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">Администратор</text><text x="64" y="844" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">или клиент VPN</text><rect x="330" y="800" width="240" height="60" rx="10" fill="#f4f0fb" stroke="#7a62bd" stroke-width="1.5"/><text x="344" y="824" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">nginx 10.128.0.12</text><text x="344" y="844" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">:9090 · :9093 · пароль</text><path d="M 250 830 L 328 830" fill="none" stroke="#c7703f" stroke-width="2" marker-end="url(#ac7703f)"/><text x="50" y="890" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Пускает только с ADMIN_CIDR и из 10.8.0.0/24.</text><text x="50" y="912" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6470" text-anchor="start">Prometheus и Alertmanager слушают лишь 127.0.0.1.</text><rect x="610" y="758" width="560" height="170" rx="10" fill="#fbfbfc" stroke="#c9ced6" stroke-width="1.5"/><text x="626" y="784" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#1f2328" text-anchor="start">Поток 6. Резервное копирование</text><rect x="630" y="800" width="180" height="60" rx="10" fill="#fdf1f1" stroke="#c0504d" stroke-width="1.5"/><text x="644" y="824" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">ca, vpn</text><text x="644" y="844" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">ежесуточно 03:20</text><rect x="930" y="800" width="220" height="60" rx="10" fill="#fdf9ec" stroke="#b8901c" stroke-width="1.5"/><text x="944" y="824" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">backup-server</text><text x="944" y="844" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">10.129.0.10 · infra-backup</text><path d="M 810 830 L 928 830" fill="none" stroke="#b8901c" stroke-width="2.4" marker-end="url(#ab8901c)"/><text x="869" y="822" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#b8901c" text-anchor="middle">SSH 22</text><text x="630" y="890" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">GPG AES-256 до отправки, сверка SHA-256 после.</text><text x="630" y="912" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6470" text-anchor="start">Ключ доступа выделенный; вписывается вручную.</text><rect x="30" y="942" width="1140" height="58" rx="10" fill="#f6f7f8" stroke="#c9ced6" stroke-width="1.5"/><text x="46" y="964" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">Сводка портов</text><text x="46" y="987" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1f2328" text-anchor="start">1194/udp — всем · 22/tcp — ADMIN_CIDR · 9100 — только 10.128.0.12 · 9090, 9093 — ADMIN_CIDR и 10.8.0.0/24 через nginx · 587 — исходящий SMTP</text></svg>