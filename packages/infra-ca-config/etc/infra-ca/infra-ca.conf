# Параметры удостоверяющего центра. Файл помечен как conffile: изменения,
# внесённые администратором, переживут обновление пакета — dpkg спросит,
# что делать, вместо того чтобы молча затереть правки.

# Каталог с инфраструктурой открытых ключей. Права 0700, владелец root.
CA_HOME="/var/lib/infra-ca"

# Куда складывать выданные сертификаты для передачи получателям.
CA_OUTGOING="/var/lib/infra-ca/outgoing"

# Срок действия выдаваемых сертификатов, дней.
CA_CERT_EXPIRE="365"

# Порог предупреждения об истечении срока корневого сертификата, дней.
CA_EXPIRY_WARN_DAYS="60"
