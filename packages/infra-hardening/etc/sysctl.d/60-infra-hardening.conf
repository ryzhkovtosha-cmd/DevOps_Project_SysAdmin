# Приносится пакетом infra-hardening. Параметры сетевого стека ядра.

# Не принимать маршруты, навязанные извне: иначе злоумышленник в той же
# сети может перенаправить трафик через себя.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Игнорировать пакеты с маршрутом, заданным отправителем.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Проверка обратного пути: отбрасывать пакеты с подменённым адресом
# источника, если ответ на этот адрес ушёл бы через другой интерфейс.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Защита от SYN-флуда.
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 2048
net.ipv4.tcp_synack_retries = 2

# Не отвечать на широковещательные пинги (иначе сервер становится
# усилителем в атаках smurf).
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Журналировать пакеты с невозможным адресом источника.
net.ipv4.conf.all.log_martians = 1

# Ограничить чтение чужих журналов ядра непривилегированными процессами.
kernel.dmesg_restrict = 1
