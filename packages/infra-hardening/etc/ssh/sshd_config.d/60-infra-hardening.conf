# Приносится пакетом infra-hardening.
# В sshd_config выигрывает ПЕРВОЕ встреченное значение параметра, поэтому
# директива Include в основном файле стоит до всех остальных настроек.

# Вход под root запрещён. Администратор заходит своим пользователем
# и повышает права через sudo — так в журнале остаётся, кто что сделал.
PermitRootLogin no

# Аутентификация только по ключам. Отключает подбор паролей как класс атаки.
PasswordAuthentication no
PermitEmptyPasswords no
ChallengeResponseAuthentication no
KbdInteractiveAuthentication no

# Ограничения на попытки и время жизни неаутентифицированной сессии.
MaxAuthTries 3
MaxSessions 5
LoginGraceTime 30

# Проброс графики и агента не нужен серверам и расширяет поверхность атаки.
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no

# Разрыв зависших сессий: три неотвеченные проверки по 60 секунд.
ClientAliveInterval 60
ClientAliveCountMax 3

# Современные алгоритмы. Исключены те, к которым есть известные претензии.
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
