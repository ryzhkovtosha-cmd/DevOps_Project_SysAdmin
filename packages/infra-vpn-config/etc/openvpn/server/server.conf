# Конфигурация VPN-сервера. Приносится пакетом infra-vpn-config.
# Файл помечен как conffile: правки администратора переживут обновление
# пакета, dpkg спросит, какую версию оставить.
#
# Написан с нуля, а не взят из sample-config-files: в образце больше
# половины строк закомментированы, и по нему невозможно с одного взгляда
# понять, что реально включено.

# --- Транспорт --------------------------------------------------------------
port 1194
proto udp
# UDP, а не TCP: туннелирование TCP внутри TCP даёт эффект наложения
# таймаутов повтора, из-за которого скорость обваливается на плохой связи.
# Сотрудники работают через публичный Wi-Fi, где потери пакетов обычны.

dev tun
# tun — маршрутизация на третьем уровне. Альтернатива tap (второй уровень)
# нужна только для широковещательных протоколов, здесь она избыточна.

topology subnet
# Каждому клиенту выдаётся обычный адрес из общей подсети с маской /24,
# а не отдельная сеть /30 на клиента, как в устаревшей схеме net30.

# --- Адресация --------------------------------------------------------------
server 10.8.0.0 255.255.255.0
ifconfig-pool-persist /var/log/openvpn/ipp.txt
# Файл соответствия «клиент — адрес»: после перезапуска сотрудник получает
# тот же адрес, что упрощает разбор журналов.

# --- Удостоверение сторон ---------------------------------------------------
ca   /etc/openvpn/server/ca.crt
cert /etc/openvpn/server/server.crt
key  /etc/openvpn/server/server.key

dh none
# Параметры Диффи-Хеллмана не нужны: ключи выпущены на эллиптических
# кривых, обмен идёт по ECDH со встроенными в сертификат параметрами.

tls-crypt /etc/openvpn/server/ta.key
# Шифрует само TLS-рукопожатие общим симметричным ключом. Пакет без этого
# ключа отбрасывается молча, до начала любых переговоров: сканер портов
# не увидит, что на 1194/udp вообще что-то есть.
# Параметр направления (цифра после имени файла) здесь НЕ указывается —
# это атрибут устаревшего tls-auth, у tls-crypt ключ симметричен.

tls-version-min 1.2
remote-cert-tls client
# Сервер требует, чтобы у клиента был сертификат именно клиентского типа.
# Без этой строки сотрудник с клиентским сертификатом мог бы выдать себя
# за сервер для другого сотрудника.

crl-verify /etc/openvpn/crl.pem
# Список отзыва: сертификат уволившегося перестаёт работать сразу,
# не дожидаясь истечения срока.
#
# Путь намеренно ВНЕ /etc/openvpn/server. OpenVPN перечитывает этот файл
# при каждом подключении клиента — то есть уже после понижения привилегий
# до nobody. Каталог server имеет права 0700 root:root, и nobody не смог бы
# в него даже войти. Сервер при этом стартует без единой жалобы, а все
# клиенты получают отказ — отлаживать такое долго и неприятно.
# Каталог /etc/openvpn имеет права 0755, сам файл кладётся с правами 0644;
# секрета в списке отзыва нет, он состоит из серийных номеров.

# --- Криптография канала данных --------------------------------------------
cipher AES-256-GCM
auth SHA256
# GCM — режим с встроенной проверкой подлинности: шифрует и одновременно
# гарантирует, что пакет не изменён по дороге.

# --- Что передаётся клиенту -------------------------------------------------
push "redirect-gateway def1 bypass-dhcp"
# Ключевая строка. Указывает клиенту завернуть в туннель ВЕСЬ трафик,
# а не только предназначенный для внутренней сети. Без неё соединение
# поднимется, но внешний адрес у сотрудника не изменится.

push "dhcp-option DNS 1.1.1.1"
push "dhcp-option DNS 8.8.8.8"
# Свои DNS-серверы, иначе имена резолвятся через провайдера сотрудника,
# и он видит, какие ресурсы посещаются, несмотря на шифрование трафика.

# push "block-outside-dns" НЕ используется намеренно.
#
# Директива существует только в клиенте под Windows. Клиент на Linux или
# macOS, получив её от сервера, завершается с ошибкой
#   "Options error: --block-outside-dns requires Windows"
# и подключиться не может. Поскольку шаблон клиентской конфигурации у нас
# один на все платформы, безопаснее не навязывать её с сервера.
# Windows-клиентам эта строка добавляется в их .ovpn вручную — см.
# руководство пользователя.

# --- Устойчивость соединения ------------------------------------------------
keepalive 10 120
# Проверка каждые 10 секунд, разрыв после 120 без ответа. На нестабильном
# публичном Wi-Fi это позволяет заметить обрыв и переподключиться.

persist-key
persist-tun
# Не перечитывать ключи и не пересоздавать интерфейс при переподключении:
# после понижения привилегий процесс уже не сможет открыть эти файлы.

explicit-exit-notify 1
# При штатной остановке сервер уведомляет клиентов, и они переподключаются
# сразу, а не ждут истечения таймаута.

# --- Понижение привилегий ---------------------------------------------------
user nobody
group nogroup
# Процесс стартует от root (нужно для создания tun0), затем сбрасывает
# права. Успешная атака на демон даёт права nobody, а не root.

# --- Журналирование ---------------------------------------------------------
status /var/log/openvpn/openvpn-status.log
log-append /var/log/openvpn/openvpn.log
verb 3
# Уровень 3 — компромисс: видно подключения и ошибки, но журнал не растёт
# гигабайтами. Уровень 4 и выше включают отладку и на постоянной основе
# не нужны.

mute 20
# Не повторять одинаковое сообщение более 20 раз подряд.

# --- Ограничения ------------------------------------------------------------
max-clients 50

# duplicate-cn намеренно НЕ включён. Каждому устройству выдаётся свой
# сертификат, поэтому два подключения с одинаковым Common Name означают,
# что сотрудник передал кому-то свой ключ. Пусть второе подключение рвёт
# первое — это заметно и приводит к разбирательству, а молчаливое
# разрешение дубликатов скрыло бы утечку.
