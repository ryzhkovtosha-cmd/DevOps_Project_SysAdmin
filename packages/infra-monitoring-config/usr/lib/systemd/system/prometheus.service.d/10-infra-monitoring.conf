# Дополнение к службе prometheus. Приносится пакетом infra-monitoring-config.
#
# Почему drop-in, а не свой /etc/prometheus/prometheus.yml: этот файл
# принадлежит пакету prometheus, и попытка принести его вторым пакетом
# приводит к отказу dpkg "trying to overwrite ..., which is also in
# package ...". Штатная конфигурация остаётся на месте, просто служба
# её больше не читает.
#
# Почему добавляется EnvironmentFile, а не переопределяется ExecStart:
# в основном юните стоит ExecStart=/usr/bin/prometheus $ARGS, а пути к
# хранилищу метрик и шаблонам консолей вкомпилированы в сборку
# дистрибутива. Переопределив команду, мы бы их потеряли и рисковали
# промахнуться мимо реальных путей конкретной версии пакета.

# Дефис перед путём делает файл НЕОБЯЗАТЕЛЬНЫМ.
#
# Без него установка ломается. Drop-in лежит в /usr/lib и попадает на
# диск на стадии распаковки, а .env — conffile, и dpkg размещает его
# только на стадии configure. Между этими моментами штатный
# установочный сценарий пакета prometheus пытается запустить службу,
# systemd не находит EnvironmentFile и отказывает с "Result: resources".
# Пакет prometheus остаётся ненастроенным, а следом и наш — по
# неудовлетворённой зависимости.
#
# С дефисом служба стартует со своими умолчаниями, а после configure
# наш postinst перезапускает её уже с нашими параметрами.

[Service]
EnvironmentFile=-/etc/prometheus/infra-prometheus.env
