# Дополнение к службе prometheus-alertmanager.
# Причины те же, что и для prometheus.

# Дефис перед путём делает файл НЕОБЯЗАТЕЛЬНЫМ.
#
# Без него установка ломается. Drop-in лежит в /usr/lib и попадает на
# диск на стадии распаковки, а .env — conffile, и dpkg размещает его
# только на стадии configure. Между этими моментами штатный
# установочный сценарий пакета prometheus пытается запустить службу,
# systemd не находит EnvironmentFile и отказывает с "Result: resources".
# Пакет prometheus остаётся ненастроенным, а следом и наш — по
# неудовлетворённой зависимости.
#
# С дефисом служба стартует со своими умолчаниями, а после configure
# наш postinst перезапускает её уже с нашими параметрами.

[Service]
EnvironmentFile=-/etc/prometheus/infra-alertmanager.env
