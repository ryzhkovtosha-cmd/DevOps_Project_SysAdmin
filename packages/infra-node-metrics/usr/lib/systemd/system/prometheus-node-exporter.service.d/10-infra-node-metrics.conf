# Дополнение к службе prometheus-node-exporter.
# Приносится пакетом infra-node-metrics.
#
# Почему drop-in, а не свой /etc/default/prometheus-node-exporter:
# этот файл принадлежит пакету prometheus-node-exporter, и попытка
# принести его вторым пакетом приводит к отказу dpkg
#   "trying to overwrite ..., which is also in package ..."
# Механизм drop-in предназначен ровно для таких случаев: он дополняет
# чужой юнит, не трогая ни одного его файла.

[Service]
# Пустое присваивание сбрасывает ExecStart из основного юнита. Без этой
# строки systemd счёл бы вторую команду ДОПОЛНИТЕЛЬНОЙ и запустил обе.
ExecStart=
ExecStart=/usr/bin/prometheus-node-exporter \
    --collector.textfile.directory=/var/lib/node_exporter/textfile_collector \
    --collector.systemd \
    --no-collector.wifi \
    --no-collector.hwmon

# --collector.textfile.directory включает чтение наших собственных метрик
#   (сроки сертификатов, состояние резервного копирования) из файлов на диске.
# --collector.systemd даёт метрику состояния юнитов: по ней работает алерт
#   SystemdUnitFailed.
# Отключены сборщики wifi и hwmon: на виртуальной машине они не дают ничего,
#   кроме сообщений об ошибках в журнале.
#
# Фильтр юнитов (--collector.systemd.unit-include) НЕ используется намеренно:
# в node-exporter 0.18 из Ubuntu 20.04 этого флага ещё нет, он назывался
# unit-whitelist. Неизвестный флаг приводит к отказу службы при старте.
# Для четырёх машин сбор состояния всех юнитов недорог, а алерт
# SystemdUnitFailed при этом охватывает больше служб.
